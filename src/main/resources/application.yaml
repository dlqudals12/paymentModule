spring:
  application:
    name: paymentModule

  datasource:
    url: jdbc:mysql://localhost:3306/payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: payment
    password: payment
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql

  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop

server:
  port: 8080

jwt:
  secret-key: QzQlU1lAVkpcXiFaSlxRND5cQkQyRjdGVDZIR0QjPWRFV0ZeWCJdUVZaSCk1TltBXF4=
  token:
    access: 86400000
    refresh: 864000000

payments:
  recovery:
    not-found-grace-ms: 600000
  toss:
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
    security-key: ${TOSS_SECURITY_KEY:}
    base-url: https://api.tosspayments.com
    path:
      confirm: /v1/payments/confirm
      payment-key: /v1/payments/{paymentKey}
      order-id: /v1/payments/orders/{orderId}
      cancel: /v1/payments/{paymentKey}/cancel
      virtual-accounts: /v1/virtual-accounts

schedule:
  payments:
    order:
      retry-delay-ms: 300000
      retry-initial-delay-ms: 60000
      retry-min-age-ms: 600000
